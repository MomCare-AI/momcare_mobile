version: 2
updates:
  # pubspec.yaml — Flutter/Dart packages (flutter_map, geolocator, dio, etc.)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keeps the CI workflow's own actions current (actions/checkout,
  # subosito/flutter-action, actions/upload-artifact).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
